services:
  postgres:
    image: postgres:17-alpine
    container_name: juanabin-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: juanabin
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # Host-side port only. Set POSTGRES_HOST_PORT=5433 in .env if a native
      # Windows PostgreSQL service is holding 5432 and you cannot stop it
      # (stopping a service needs Administrator). The api service below is
      # unaffected either way - it reaches the database over the compose
      # network on 5432, never through this mapping.
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d juanabin"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: juanabin-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # "postgres" is the compose service name - 127.0.0.1 would resolve to this
      # container, not the database.
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/juanabin
      FRONTEND_URL: http://localhost:5173
      ALLOWED_ORIGINS: http://localhost:5173
      KINDE_AUTH_ENABLED: "false"
      KINDE_ISSUER: ""
      KINDE_AUDIENCE: juanabin-ph
    ports:
      - "8001:8000"
    volumes:
      # Live-reload the source without rebuilding the image.
      - ./backend:/app/backend
    command:
      - uvicorn
      - backend.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  postgres_data:
